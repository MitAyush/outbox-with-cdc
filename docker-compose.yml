services:
  postgres:
    image: postgres:17
    container_name: experiment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: experiment
      POSTGRES_PASSWORD: experiment123
      POSTGRES_DB: orders_db
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experiment -d orders_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: